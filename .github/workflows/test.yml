name: Python Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests with coverage
        env :
          PYTHONPATH: ${{ github.workspace }}/submissions/yzf/vision-toolkit
        run: pytest --cov=src --cov-report=term-missing --cov-fail-under=80 -v
